<head>
    <meta charset="UTF-8">

    <style>

            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;

            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .question-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-left: 5px solid #3498db;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .question-text {
            font-weight: bold;
            font-size: 1.05em;
            margin-bottom: 12px;
            white-space: pre-line;
        }
        .options {
            margin-left: 10px;
        }
        .option-label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }
        input[type="text"] {
            width: 80%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 5px;
        }
        .btn-container {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        button.btn-reset {
            background-color: #e67e22;
        }
        button.btn-reset:hover {
            background-color: #d35400;
        }
        .result-box {
            display: none;
            background: #e8f8f5;
            border: 1px solid #2ecc71;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 25px;
            text-align: center;
        }
        .correct {
            color: #27ae60;
            font-weight: bold;
        }
        .wrong {
            color: #c0392b;
            font-weight: bold;
        }
        .feedback {
            margin-top: 10px;
            padding: 10px;
            background: #fff;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        /* 版權宣告樣式 */
        .copyright-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #4a5568;
            font-size: 0.95em;
            line-height: 1.8;
        }
        .copyright-footer strong {
            color: #2d3748;
            font-size: 1.05em;
        }
        .copyright-footer a {
            color: #0073e6;
            text-decoration: none;
        }
        .copyright-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Level 2 會計線上練習題庫</h1>

let currentQuestions = [];

function initQuiz() {
    document.getElementById('resultBox').style.display = 'none';
    
    // 隨機抽取 30 題
    const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
    currentQuestions = shuffled.slice(0, 30);

    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    currentQuestions.forEach((q, index) => {
        const qCard = document.createElement('div');
        qCard.className = 'question-card';
        qCard.id = `q_card_${index}`;

        let html = `<div class="question-text">Q${index + 1}. ${q.question}</div>`;

        if (q.type === 'mc') {
            html += `<div class="options">`;
            q.options.forEach((opt) => {
                html += `
                    <label class="option-label">
                        <input type="radio" name="q_${index}" value="${opt}">
                        ${opt}
                    </label>
                `;
            });
            html += `</div>`;
        } else if (q.type === 'text') {
            html += `
                <div class="options">
                    <input type="text" name="q_${index}" placeholder="請在此輸入答案數值或關鍵字">
                </div>
            `;
        }

        html += `<div id="feedback_${index}" class="feedback" style="display:none;"></div>`;
        qCard.innerHTML = html;
        container.appendChild(qCard);
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
    let score = 0;

    currentQuestions.forEach((q, index) => {
        const feedbackDiv = document.getElementById(`feedback_${index}`);
        let userAns = "";

        if (q.type === 'mc') {
            const selected = document.querySelector(`input[name="q_${index}"]:checked`);
            if (selected) userAns = selected.value;
        } else if (q.type === 'text') {
            const input = document.querySelector(`input[name="q_${index}"]`);
            if (input) userAns = input.value.trim();
        }

        feedbackDiv.style.display = 'block';

        const isCorrect = userAns.toString().toLowerCase().replace(/,|\$|\s/g, '') === 
                          q.answer.toString().toLowerCase().replace(/,|\$|\s/g, '');

        if (isCorrect) {
            score++;
            feedbackDiv.innerHTML = `<span class="correct">✓ 正確！</span>`;
        } else {
            feedbackDiv.innerHTML = `<span class="wrong">✗ 錯誤！</span> 你的答案：${userAns || "未作答"} | <strong>正確答案：${q.answer}</strong>`;
        }
    });

    const resultBox = document.getElementById('resultBox');
    const scoreText = document.getElementById('scoreText');
    const percentage = Math.round((score / currentQuestions.length) * 100);
    
    scoreText.innerHTML = `得分：<strong>${score} / ${currentQuestions.length}</strong> （正確率：${percentage}%）`;
    resultBox.style.display = 'block';
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = initQuiz;
</script>

</body>
</html>
